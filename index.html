<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greg Robin — Selected Work</title>
<style>
/* ==========================================================================
   PORTFOLIO SHELL — Slate & Signal
   Dark charcoal chrome frames the white documents; orange-red is the only
   saturated element on screen.
   Chrome tokens and stage tokens are separate groups: swapping the scheme
   means replacing the chrome + brand block only.
   ========================================================================== */
:root{
  /* chrome — masthead, tab bar, toolbar */
  --chrome:#434343;
  --chrome-ink:#FFFFFF;
  --chrome-muted:rgba(255,255,255,.66);
  --chrome-line:rgba(255,255,255,.15);
  --chrome-hover:rgba(255,255,255,.09);

  /* brand accent */
  --brand:#D85227;
  --brand-dk:#B8421C;
  --brand-dker:#9E3817;
  --brand-ink:#FFFFFF;
  --brand-soft:rgba(216,82,39,.26);
  --badge-ink:#FFC7AC;
  --accent:#D85227;
  --btn-hover-bg:#FBEFEA;
  --code-bg:#FBEDE7;
  --code-ink:#A63C18;

  /* stage — the light surface behind framed content and fallback cards.
     Matched to the grey backdrop Google's /preview renders behind a Doc page,
     so the seam between the shell and a framed document is invisible. */
  --bg:#F8F9FA;
  --card:#FFFFFF;
  --ink:#434343;
  --ink2:#5A5A56;
  --muted:#7A7A72;
  --faint:#9B9B93;
  --line:#E4E4DF;
  --line2:#F0F0EC;

  --r:10px; --r-sm:7px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 1px 12px rgba(0,0,0,.06);
  --font:"Google Sans","Google Sans Text","Product Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font); background:var(--bg); color:var(--ink);
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; height:100dvh; overflow:hidden;
}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.012em;line-height:1.25}
p{margin:0}
a{color:inherit}
button{font-family:inherit;font-size:inherit;cursor:pointer}

/* ---------- header ---------- */
.mast{
  background:var(--chrome); border-bottom:1px solid var(--chrome-line);
  padding:13px 22px; display:flex; align-items:center; gap:14px; flex:none;
}
.logomark{
  width:38px;height:38px;border-radius:8px;background:var(--brand);
  display:grid;place-items:center;flex:none;color:var(--brand-ink);
  font-weight:600;font-size:14px;letter-spacing:.02em;
}
.mast-txt{flex:1;min-width:0}
.mast-txt h1{font-size:17px;font-weight:600;color:var(--chrome-ink)}
.mast-txt p{font-size:12.5px;color:var(--chrome-muted);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mast-contact{
  flex:none;font-size:12.5px;color:var(--chrome-muted);text-decoration:none;
  border:1px solid var(--chrome-line);border-radius:20px;padding:6px 14px;transition:.14s;
}
.mast-contact:hover{border-color:rgba(255,255,255,.34);color:var(--chrome-ink);
  background:var(--chrome-hover)}

/* ---------- tab bar ---------- */
.tabbar{
  background:var(--chrome); border-bottom:1px solid var(--chrome-line);
  padding:0 14px; display:flex; gap:2px; flex:none;
  overflow-x:auto; scrollbar-width:none;
}
.tabbar::-webkit-scrollbar{display:none}
.tab{
  border:none; background:transparent; color:var(--chrome-muted);
  padding:11px 14px 9px; font-size:13px; font-weight:500;
  white-space:nowrap; transition:.14s; position:relative;
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tab:hover{color:var(--chrome-ink)}
.tab[aria-selected="true"]{color:var(--chrome-ink);font-weight:600;border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;border-radius:4px}

/* ---------- toolbar strip ---------- */
.strip{
  background:var(--chrome); border-bottom:1px solid var(--chrome-line);
  padding:8px 22px; display:flex; align-items:center; gap:10px; flex:none;
  flex-wrap:wrap;
}
.strip-note{font-size:12.5px;color:var(--chrome-muted);flex:1;min-width:120px}
.badge{
  display:inline-flex;align-items:center;gap:5px;background:var(--brand-soft);
  color:var(--badge-ink);border-radius:20px;padding:3px 10px;
  font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  white-space:nowrap;flex:none;
}
.strip .btn{
  border:1px solid var(--chrome-line);background:transparent;color:var(--chrome-ink);
}
.strip .btn:hover{border-color:rgba(255,255,255,.34);background:var(--chrome-hover);
  color:var(--chrome-ink)}
.btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink2);
  border-radius:var(--r-sm);padding:6px 12px;font-size:12px;font-weight:500;
  transition:.14s;white-space:nowrap;text-decoration:none;display:inline-flex;
  align-items:center;gap:6px;flex:none;
}
.btn:hover{border-color:var(--brand);color:var(--brand);background:var(--btn-hover-bg)}
.btn svg{width:13px;height:13px}

/* ---------- frame stage ---------- */
.stage{flex:1;position:relative;min-height:0;background:var(--bg)}
.pane{position:absolute;inset:0;display:none}
.pane.active{display:block}
.pane iframe{width:100%;height:100%;border:none;background:#fff;display:block}

/* loading + fallback overlays */
.overlay{
  position:absolute;inset:0;display:grid;place-items:center;
  background:var(--bg);padding:30px;text-align:center;
}
.overlay[hidden]{display:none!important}
.spinner{
  width:26px;height:26px;border:2.5px solid var(--line);
  border-top-color:var(--brand);border-radius:50%;
  animation:spin .7s linear infinite;margin:0 auto 12px;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}}
.overlay .msg{font-size:12.5px;color:var(--muted)}
.fallback-card{
  max-width:460px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);padding:26px 28px;text-align:left;
}
.fallback-card h3{font-size:15px;color:var(--ink)}
.fallback-card p{font-size:12.8px;color:var(--ink2);margin-top:8px;line-height:1.6}
.fallback-card .why{font-size:11.8px;color:var(--muted);margin-top:10px;
  background:var(--bg);border:1px solid var(--line2);border-radius:var(--r-sm);padding:10px 12px}
.fallback-card .acts{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.fallback-card .btn.primary{background:var(--brand-dk);border-color:var(--brand-dk);color:#fff}
.fallback-card .btn.primary:hover{background:var(--brand-dker);border-color:var(--brand-dker);color:#fff}

/* empty state when no tabs are configured */
.empty{max-width:520px;text-align:left}
.empty h2{font-size:17px;color:var(--ink)}
.empty p{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.65}
.empty code{background:var(--code-bg);color:var(--code-ink);padding:2px 6px;
  border-radius:4px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* toast */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);
  background:var(--chrome);color:#fff;padding:10px 20px;border-radius:22px;
  font-size:12.5px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.3);
  transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:99;
}
.toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:640px){
  .mast{padding:11px 14px;gap:10px}
  .mast-txt h1{font-size:15px}
  .mast-txt p{display:none}
  .mast-contact{display:none}
  .strip{padding:8px 14px}
  .strip-note{display:none}
  .tabbar{padding:0 8px}
}
</style>
</head>
<body>

<script>
/* ==========================================================================
   ▼▼▼  CONFIGURE YOUR PORTFOLIO HERE  ▼▼▼
   This is the only section you need to edit. Everything below it is machinery.
   ========================================================================== */

const SITE = {
  // ① Big name in the header
  title:    "Greg Robin",

  // ② Grey line under it
  subtitle: "Salesforce & Revenue Operations — selected work",

  // Letters inside the orange square. Two characters fit best; "" leaves it blank.
  initials: "GR",

  // The pill on the right. Change the words, the address, or both.
  // Swap href to a LinkedIn/Calendly URL any time you'd rather it not open mail.
  contact:  { label: "Get in touch", href: "mailto:greg@productivityadvisors.com" },

  noindex:  false   // true = ask search engines not to index this page
};

/* Up to 10 tabs. Delete or comment out the ones you don't need.

   ③ label — the tab itself
   ④ note  — the grey line in the toolbar, beside the chip
   ⑤ badge — the chip. Optional: leave it out and it names the source type
             automatically ("Google Doc", "Google Sheet", "Web page"). Set it
             to any words you want, or "" to hide the chip entirely.
   src     — paste the URL exactly as you normally copy it. Google share links
             ("…/edit?usp=sharing") are converted to their embeddable form
             automatically — you do NOT need to hand-edit them.

   Anything with an empty src is skipped, so placeholders are safe to leave in. */

const TABS = [
   {
    label: "Visual Resume",
    src:   "https://docs.google.com/presentation/d/1WPWn_Hf_yREZS4uhW8duWkIKPgXo0aaE_VAy4InFKFw/edit?slide=id.p#slide=id.p",  
    note:  "Architectural Learnings"
   },
   {
    label: "Customer Interaction Summary",
    src:   "https://docs.google.com/document/d/1VDfDF-Of0TNDBj8f67LayT0f1k7oqL7mLPSF-TKVMZE/edit?usp=sharing",
    note:  "Executive summary — customer interaction model"
    // badge omitted → reads "Google Doc"
  },
  {
    label: "Quoting App",
    src:   "https://gnrobin.github.io/prodadv/northwind-pricing-app.html",
    note:  "Interactive quote builder, discount approvals, and TCO model",
    badge: "Live Demo"
  },
  {
    label: "Discovery",
    src:   "https://drive.google.com/file/d/1hXZ2oBmW4npXT0XwlCFTZmr4x9Qpey6A/view?usp=sharing",
    note:  "Revenue Operations Discovery"
  },
  {
    label: "Best Practices",
    src:   "https://drive.google.com/file/d/1KXBOWDiralm06kob5WUbXOjk7wSuXGnm/view?usp=sharing",   
    note:  "Salesforce Best Practices Examples"
  },
  { label: "Tab 6", src: "", note: "" }
];

/* ==========================================================================
   ▲▲▲  END OF CONFIGURATION  ▲▲▲
   ========================================================================== */


/* --------------------------------------------------------------------------
   1. SOURCE RESOLVER
   Turns a pasted URL into the form that actually renders inside a frame.
   Google blocks /edit URLs from being framed; /preview and /embed are the
   supported equivalents. Everything else is passed through untouched.
   -------------------------------------------------------------------------- */
const MAX_TABS = 10;

function resolveSource(raw){
  const s = String(raw || '').trim();
  if (!s) return null;

  const grab = re => { const m = s.match(re); return m ? m[1] : null; };
  let id;

  if ((id = grab(/docs\.google\.com\/document\/d\/([\w-]{10,})/)))
    return { kind:'Google Doc', url:`https://docs.google.com/document/d/${id}/preview` };

  if ((id = grab(/docs\.google\.com\/spreadsheets\/d\/([\w-]{10,})/)))
    return { kind:'Google Sheet', url:`https://docs.google.com/spreadsheets/d/${id}/preview` };

  if ((id = grab(/docs\.google\.com\/presentation\/d\/([\w-]{10,})/)))
    return { kind:'Google Slides',
             url:`https://docs.google.com/presentation/d/${id}/embed?start=false&loop=false&delayms=60000`,
             fullscreen:true };

  if ((id = grab(/docs\.google\.com\/forms\/d\/e\/([\w-]{10,})/)))
    return { kind:'Google Form', url:`https://docs.google.com/forms/d/e/${id}/viewform?embedded=true` };

  if ((id = grab(/drive\.google\.com\/file\/d\/([\w-]{10,})/)))
    return { kind:'Drive file', url:`https://drive.google.com/file/d/${id}/preview` };

  if ((id = grab(/drive\.google\.com\/(?:drive\/(?:u\/\d+\/)?)?folders\/([\w-]{10,})/)))
    return { kind:'Drive folder', url:`https://drive.google.com/embeddedfolderview?id=${id}#grid` };

  // already-published Google URLs (/pub, /pubhtml, /embed) pass through as-is
  if (/docs\.google\.com/.test(s) && /\/(pub|pubhtml|embed|preview)\b/.test(s))
    return { kind:'Google', url:s };

  if (/\.pdf($|[?#])/i.test(s)) return { kind:'PDF', url:s };

  return { kind:'Web page', url:s };
}

/* --------------------------------------------------------------------------
   2. BUILD
   -------------------------------------------------------------------------- */
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'tab';

const ICON_EXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>';
const ICON_LINK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

// Keep only tabs that actually have a source, capped at MAX_TABS.
const items = TABS
  .map(t => ({ ...t, resolved: resolveSource(t.src) }))
  .filter(t => t.resolved)
  .slice(0, MAX_TABS);

if (TABS.filter(t => String(t.src||'').trim()).length > MAX_TABS)
  console.warn(`Portfolio: more than ${MAX_TABS} sources configured — only the first ${MAX_TABS} are shown.`);

// de-duplicate slugs so deep links stay unique
const seen = {};
items.forEach(t => {
  let base = slug(t.label);
  seen[base] = (seen[base] || 0) + 1;
  t.slug = seen[base] > 1 ? `${base}-${seen[base]}` : base;
});

if (SITE.noindex){
  const m = document.createElement('meta');
  m.name = 'robots'; m.content = 'noindex, nofollow';
  document.head.appendChild(m);
}
document.title = SITE.title + (SITE.subtitle ? ' — ' + SITE.subtitle.split('—')[0].trim() : '');

document.body.insertAdjacentHTML('afterbegin', `
  <header class="mast">
    <div class="logomark">${esc(SITE.initials || '')}</div>
    <div class="mast-txt">
      <h1>${esc(SITE.title)}</h1>
      <p>${esc(SITE.subtitle)}</p>
    </div>
    ${SITE.contact && SITE.contact.href
      ? `<a class="mast-contact" href="${esc(SITE.contact.href)}">${esc(SITE.contact.label)}</a>` : ''}
  </header>

  <nav class="tabbar" role="tablist" aria-label="Portfolio sections" id="tabbar">
    ${items.map((t,i)=>`
      <button class="tab" role="tab" id="tab-${t.slug}"
              aria-controls="pane-${t.slug}" aria-selected="${i===0}"
              tabindex="${i===0?0:-1}" data-i="${i}">${esc(t.label)}</button>`).join('')}
  </nav>

  <div class="strip">
    <span class="badge" id="stripBadge"></span>
    <span class="strip-note" id="stripNote"></span>
    <button class="btn" id="btnCopy">${ICON_LINK} Copy link</button>
    <a class="btn" id="btnOpen" target="_blank" rel="noopener">${ICON_EXT} Open in new tab</a>
  </div>

  <main class="stage" id="stage">
    ${items.map((t,i)=>`
      <section class="pane ${i===0?'active':''}" id="pane-${t.slug}"
               role="tabpanel" aria-labelledby="tab-${t.slug}" data-i="${i}">
        <div class="overlay" data-role="loading">
          <div><div class="spinner"></div><div class="msg">Loading ${esc(t.label)}…</div></div>
        </div>
        <div class="overlay" data-role="fallback" hidden>
          <div class="fallback-card">
            <h3>This one won't display inline</h3>
            <p>${esc(t.label)} is taking longer than expected, or the source is refusing to be embedded. It still works — it just needs its own tab.</p>
            <div class="why">Most common cause: a Google file that isn't shared with <strong>Anyone with the link</strong>, or a link copied from the address bar while editing rather than from the Share dialog.</div>
            <div class="acts">
              <a class="btn primary" href="${esc(t.src)}" target="_blank" rel="noopener">${ICON_EXT} Open ${esc(t.label)}</a>
              <button class="btn" data-retry="${i}">Try again</button>
            </div>
          </div>
        </div>
      </section>`).join('')}
  </main>

  <div class="toast" id="toast"></div>
`);

// Nothing configured yet — show a helpful empty state instead of a blank page.
if (!items.length){
  $('#stage').innerHTML = `
    <div class="overlay">
      <div class="empty">
        <h2>No sources configured yet</h2>
        <p>Open this file in a text editor and fill in the <code>TABS</code> array near the top.
           Paste Google Doc, Sheet, or Slides share links exactly as you copy them —
           they're converted to their embeddable form automatically — and paste the full
           URL for any hosted HTML app.</p>
        <p>Any tab with an empty <code>src</code> is skipped, so you can add them one at a time.</p>
      </div>
    </div>`;
  $('#tabbar').style.display = 'none';
  $('.strip').style.display = 'none';
}

/* --------------------------------------------------------------------------
   3. LAZY MOUNTING + FRAME HEALTH
   Frames are created the first time their tab is opened, so the page loads
   fast no matter how many heavy documents are configured.

   Note on detection: a browser fires `load` even for a frame the remote host
   refused, so `load` alone can't prove success. We use it to clear the
   spinner, and a timeout to surface the fallback — which is why every tab
   also carries a permanent "Open in new tab" action.
   -------------------------------------------------------------------------- */
const LOAD_TIMEOUT_MS = 12000;
const mounted = new Set();

function mount(i){
  if (mounted.has(i)) return;
  mounted.add(i);

  const t    = items[i];
  const pane = document.getElementById('pane-' + t.slug);
  const load = pane.querySelector('[data-role="loading"]');
  const fail = pane.querySelector('[data-role="fallback"]');

  const fr = document.createElement('iframe');
  fr.src   = t.resolved.url;
  fr.title = t.label;
  fr.setAttribute('referrerpolicy','no-referrer-when-downgrade');
  if (t.resolved.fullscreen) fr.setAttribute('allowfullscreen','');

  const timer = setTimeout(() => { load.hidden = true; fail.hidden = false; }, LOAD_TIMEOUT_MS);
  fr.addEventListener('load', () => { clearTimeout(timer); load.hidden = true; });

  pane.insertBefore(fr, pane.firstChild);
}

function remount(i){
  const t    = items[i];
  const pane = document.getElementById('pane-' + t.slug);
  const old  = pane.querySelector('iframe');
  if (old) old.remove();
  pane.querySelector('[data-role="fallback"]').hidden = true;
  pane.querySelector('[data-role="loading"]').hidden  = false;
  mounted.delete(i);
  mount(i);
}

/* --------------------------------------------------------------------------
   4. TAB SWITCHING
   -------------------------------------------------------------------------- */
let current = -1;

function show(i, pushHash = true){
  if (!items.length) return;
  i = Math.max(0, Math.min(items.length - 1, i));
  if (i === current) return;
  current = i;
  const t = items[i];

  document.querySelectorAll('.tab').forEach(b => {
    const on = +b.dataset.i === i;
    b.setAttribute('aria-selected', on);
    b.tabIndex = on ? 0 : -1;
  });
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', +p.dataset.i === i));

  const badge = t.badge === undefined ? t.resolved.kind : t.badge;
  $('#stripBadge').textContent = badge;
  $('#stripBadge').hidden = !badge;
  $('#stripNote').textContent  = t.note || '';
  $('#btnOpen').href = t.src;
  $('#btnOpen').setAttribute('aria-label', 'Open ' + t.label + ' in a new tab');

  mount(i);
  if (pushHash) history.replaceState(null, '', '#' + t.slug);
}

$('#tabbar')?.addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (b) show(+b.dataset.i);
});

// arrow-key navigation across the tab list
$('#tabbar')?.addEventListener('keydown', e => {
  const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1
          : e.key === 'Home' ? -999 : e.key === 'End' ? 999 : 0;
  if (!d) return;
  e.preventDefault();
  const next = d === -999 ? 0 : d === 999 ? items.length - 1 : current + d;
  show(next);
  document.getElementById('tab-' + items[Math.max(0, Math.min(items.length-1, next))].slug)?.focus();
});

$('#stage')?.addEventListener('click', e => {
  const b = e.target.closest('[data-retry]');
  if (b) remount(+b.dataset.retry);
});

function toast(msg){
  const el = $('#toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2000);
}

$('#btnCopy')?.addEventListener('click', () => {
  const url = location.origin + location.pathname + '#' + items[current].slug;
  navigator.clipboard?.writeText(url)
    .then(() => toast('Link to this tab copied'))
    .catch(() => toast(url));
});

// deep link: /index.html#gtm-backlog opens straight to that tab
window.addEventListener('hashchange', () => {
  const i = items.findIndex(t => t.slug === location.hash.slice(1));
  if (i >= 0) show(i, false);
});

const startIdx = items.findIndex(t => t.slug === location.hash.slice(1));
show(startIdx >= 0 ? startIdx : 0, startIdx < 0);

/* exposed for automated verification */
window.__portfolio = { items, resolveSource, show, get current(){ return current; } };
</script>

</body>
</html>
